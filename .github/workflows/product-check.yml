name: product-check
on:
  push:
    branches: [master]
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AXIOM_SECRET_KEY: ci-synthetic-key-for-local-tests-only-12345678901234567890
      AXIOM_DB_PASSWORD: ci-disposable-password
      AXIOM_JOURNAL_TOKEN: ci-synthetic-journal-token-0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: |
          python -m venv .venv-backend
          .venv-backend/bin/python -m pip install --require-hashes -r backend/requirements-dev.lock
      - run: .venv-backend/bin/pyright -p backend
      - run: docker compose -p axiom-ci up --build -d --wait --wait-timeout 120
      - name: Backend tests with branch coverage
        run: |
          mkdir -p reports
          docker compose -p axiom-ci -f compose.yaml -f tools/coverage/compose.yaml run --build --rm --no-deps --user "$(id -u):$(id -g)" coverage
      - uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: reports/backend-coverage.xml
          if-no-files-found: error
      - run: docker compose -p axiom-ci run --rm web python -m mathematics.smoke
      - run: docker compose -p axiom-ci run --rm web python manage.py makemigrations --check --dry-run
      - run: docker compose -p axiom-ci run --rm web python manage.py probe_smoke
      - run: docker compose -p axiom-ci run --rm web python manage.py runtime_smoke
      - run: docker compose -p axiom-ci exec -T web python manage.py catalog_smoke
      - run: docker compose -p axiom-ci exec -T web python manage.py catalog_smoke --frontend
      - run: docker compose -p axiom-ci exec -T web python manage.py ingest_preview_smoke
      - name: Loopback HTTP and frontend proxy smoke
        run: |
          curl --silent --show-error --output /dev/null --connect-timeout 5 --max-time 15 --fail http://127.0.0.1:18000/health/ready/
          curl --silent --show-error --output /dev/null --connect-timeout 5 --max-time 15 --fail http://127.0.0.1:15173/health/ready/
          curl --silent --show-error --output /dev/null --connect-timeout 5 --max-time 15 --fail http://127.0.0.1:15173/
          curl --silent --show-error --output /dev/null --connect-timeout 5 --max-time 15 --fail http://127.0.0.1:15173/src/main.ts
          curl --silent --show-error --output /dev/null --connect-timeout 5 --max-time 15 --fail http://127.0.0.1:15173/src/App.vue
          curl --silent --show-error --output /dev/null --connect-timeout 5 --max-time 15 --fail --retry 5 --retry-delay 1 --retry-all-errors http://127.0.0.1:15173/node_modules/.vite/deps/vue.js
      - name: Real opt-in INGEST
        env:
          AXIOM_INGEST_ENABLED: "1"
          AXIOM_IMPORT_LIMITS: '{"max_rows":100,"max_columns":8,"max_cell_utf8_bytes":4096,"max_decoded_bytes":65536,"max_parse_seconds":10}'
        run: |
          docker compose -p axiom-ci --profile ingest up -d --wait --wait-timeout 120
          docker compose -p axiom-ci exec -T web python manage.py business_ingest_smoke
          docker compose -p axiom-ci exec -T web python manage.py research_inspection_smoke
      - name: Real opt-in PROFILE, formal seal and paired ledgers
        env:
          AXIOM_INGEST_ENABLED: "1"
          AXIOM_IMPORT_LIMITS: '{"max_rows":100,"max_columns":8,"max_cell_utf8_bytes":4096,"max_decoded_bytes":65536,"max_parse_seconds":10}'
          AXIOM_PROFILE_ENABLED: "1"
          AXIOM_PROFILE_LIMITS: '{"max_rows":100,"max_columns":8,"max_cell_utf8_bytes":4096,"max_decoded_bytes":65536,"max_parse_seconds":10}'
          AXIOM_SEALING_ENABLED: "1"
        run: |
          docker compose -p axiom-ci --profile ingest --profile profile up -d --wait --wait-timeout 120
          docker compose -p axiom-ci exec -T journal python -c "import json,os,socket,struct; assert os.getuid()==10004; s=socket.socket(socket.AF_UNIX,socket.SOCK_STREAM); s.settimeout(5); s.connect('/var/lib/axiom/socket/journal.sock'); b=json.dumps({'op':'health','token':os.environ['AXIOM_JOURNAL_TOKEN']}).encode(); s.sendall(struct.pack('!I',len(b))+b); h=s.recv(4); assert json.loads(s.recv(struct.unpack('!I',h)[0]))['status']=='ok'"
          docker compose -p axiom-ci exec -T web python manage.py profile_smoke
          docker compose -p axiom-ci exec -T web python manage.py research_draft_smoke
      - name: Real opt-in M3 end-to-end chain, security isolation, load measurement and backup restore drill
        env:
          AXIOM_INGEST_ENABLED: "1"
          AXIOM_IMPORT_LIMITS: '{"max_rows":100,"max_columns":8,"max_cell_utf8_bytes":4096,"max_decoded_bytes":65536,"max_parse_seconds":10}'
          AXIOM_PROFILE_ENABLED: "1"
          AXIOM_PROFILE_LIMITS: '{"max_rows":100,"max_columns":8,"max_cell_utf8_bytes":4096,"max_decoded_bytes":65536,"max_parse_seconds":10}'
          AXIOM_SEALING_ENABLED: "1"
          AXIOM_SEARCH_ENABLED: "1"
          AXIOM_SEARCH_LIMITS: '{"max_rows":4096,"max_strategy_seconds":10,"max_candidates":8}'
          AXIOM_FIT_ENABLED: "1"
          AXIOM_FIT_LIMITS: '{"max_rows":4096,"max_columns":8,"max_cell_utf8_bytes":4096,"max_decoded_bytes":65536,"max_parse_seconds":30}'
        run: |
          docker compose -p axiom-ci --profile ingest --profile profile --profile search --profile fit up -d --wait --wait-timeout 120
          docker compose -p axiom-ci exec -T web python manage.py m3_e2e_smoke
          docker compose -p axiom-ci exec -T web python manage.py m3_e2e_smoke --frontend
          docker compose -p axiom-ci exec -T web python manage.py security_smoke
          docker compose -p axiom-ci exec -T web python manage.py security_smoke --frontend
          docker compose -p axiom-ci exec -T web python manage.py perf_smoke --requests 200 --concurrency 10
          docker compose -p axiom-ci exec -T web python manage.py perf_smoke --frontend --requests 200 --concurrency 10
          docker compose -p axiom-ci exec -T web python manage.py restore_smoke
          docker compose -p axiom-ci exec -T web python manage.py restore_smoke --frontend
      - name: Logs and cleanup
        if: always()
        run: |
          docker compose -p axiom-ci --profile ingest --profile profile --profile search --profile fit logs --no-color
          docker compose -p axiom-ci --profile ingest --profile profile --profile search --profile fit down --volumes --remove-orphans
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: frontend
      - run: npm run typecheck && npm run test:coverage && npm run build
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/
          if-no-files-found: error
  coverage:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: backend-coverage
          path: reports
      - uses: actions/download-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage
      - name: Verify portable report paths and complete frontend scope
        run: python tools/check_coverage_reports.py
      # Existing server-side gates apply. Opt in after configuring SONAR_TOKEN;
      # Community Edition only receives the main-branch push, not PR analysis.
      - name: SonarQube coverage import and quality gate
        if: github.event_name == 'push' && vars.SONAR_ENABLED == 'true'
        uses: SonarSource/sonarqube-scan-action@v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >-
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300
