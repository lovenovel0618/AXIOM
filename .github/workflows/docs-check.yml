name: docs-check

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dev dependencies
        run: |
          python -m venv .venv-backend
          .venv-backend/bin/python -m pip install --require-hashes -r backend/requirements-dev.lock
      - name: Test engineering tools
        run: .venv-backend/bin/python -m unittest discover -s tests -v
      - name: Validate development baseline
        run: .venv-backend/bin/python tools/development_baseline.py
      - name: Check public benchmark references
        run: .venv-backend/bin/python -m tools.benchmark.public_oracle
      - name: Type check Python tools, backend and tests
        run: .venv-backend/bin/pyright
      - name: Validate documentation and contracts
        run: .venv-backend/bin/python docs/企劃案/tools/check_docs.py
