# Merge with compose.yaml; this service only runs against the disposable test DB.
services:
  coverage:
    extends:
      file: compose.yaml
      service: worker
    build:
      target: coverage
    working_dir: /workspace
    environment:
      AXIOM_OBJECT_ROOT: /tmp/axiom-coverage-objects
    volumes:
      - ./reports:/workspace/reports
    command:
      - sh
      - -ec
      - |
        mkdir -p "$$AXIOM_OBJECT_ROOT"
        python -m coverage erase
        python -m coverage run backend/manage.py test foundation.tests runtime.tests catalog.tests mathematics.tests mathematics.test_linalg mathematics.test_search mathematics.test_comparison ingestion.tests --noinput -v 2
        python -m coverage xml
        python -m coverage report --skip-covered
