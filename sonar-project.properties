# AXIOM SonarQube scan scope.
# The only analysis exclusion is the Django-generated migration modules:
# they are machine-written by "makemigrations" and regenerated on every model
# change, so editing them by hand is not allowed and would be reverted.
sonar.projectKey=axion
sonar.projectName=AXIOM
sonar.host.url=https://sonarqube.gogotdi.com
sonar.sourceEncoding=UTF-8
sonar.sources=.
sonar.exclusions=**/migrations/*.py
