# AXIOM SonarQube scan scope.
# The only analysis exclusion is the Django-generated migration modules:
# they are machine-written by "makemigrations" and regenerated on every model
# change, so editing them by hand is not allowed and would be reverted.
sonar.projectKey=axion
sonar.projectName=AXIOM
sonar.host.url=https://sonarqube.gogotdi.com
sonar.sourceEncoding=UTF-8
sonar.sources=.
sonar.exclusions=**/migrations/*.py
sonar.python.coverage.reportPaths=reports/backend-coverage.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
# Classify tests separately so they do not inflate the production denominator.
sonar.tests=backend,frontend/tests,tests
sonar.test.inclusions=backend/**/tests/**,backend/**/tests.py,backend/**/test_*.py,frontend/tests/**,tests/**
sonar.python.version=3.13
